{% extends "base.html" %}
{% block title %}Novo documento — Assinatura{% endblock %}

{% block content %}
<div class="page-header">
  <h1><i class="fas fa-file-upload me-2"></i>Novo documento</h1>
  <p><a href="{{ url_for('listar_assinaturas') }}" class="text-muted">Assinatura de Documentos</a> › Novo</p>
</div>

<div class="card" style="max-width:560px;">
  <div class="card-body">
    <form method="POST" enctype="multipart/form-data">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <label class="form-label">Arquivo PDF</label>
      <input type="file" name="arquivo" accept="application/pdf,.pdf" class="form-control" required>
      <small class="text-muted d-block mt-2">No próximo passo você escolhe a página, a posição da assinatura e o método (eletrônica simples ou certificado ICP-Brasil).</small>
      <button type="submit" class="btn btn-accent mt-3"><i class="fas fa-arrow-right me-1"></i>Continuar</button>
    </form>
  </div>
</div>
{% endblock %}
