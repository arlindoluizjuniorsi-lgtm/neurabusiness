<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nova digitalização — Escanear Documentos</title>
<link rel="icon" type="image/png" sizes="32x32" href="{{ url_for('static', filename='img/favicon-32.png') }}">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
  body{background:#0f172a;color:#e2e8f0;font-family:system-ui,sans-serif;min-height:100vh;}
  .topo{background:#111827;border-bottom:1px solid #2a3647;padding:14px 0;}
  .logo{color:#f97316;font-weight:800;font-size:1.25rem;}
  .card{background:#1a2332;border:1px solid #2a3647;border-radius:12px;}
  .form-control{background:#0f172a;border-color:#2a3647;color:#e2e8f0;}
  .form-control:focus{background:#0f172a;border-color:#f97316;color:#e2e8f0;box-shadow:0 0 0 .2rem rgba(249,115,22,.2);}
  .btn-laranja{background:#f97316;border-color:#f97316;color:#fff;font-weight:600;}
  .btn-laranja:hover{background:#dd6614;border-color:#dd6614;color:#fff;}
  a{color:#f97316;}
  .text-muted{color:#94a3b8!important;}
</style>
</head>
<body>
<div class="topo">
  <div class="container d-flex justify-content-between align-items-center flex-wrap gap-2">
    <div class="logo"><i class="fas fa-camera me-2"></i>Escanear Documentos</div>
    <div class="small text-muted">
      {{ conta.nome or conta.email }} &middot;
      <a href="{{ url_for('escanear_publico_sair') }}">Sair</a>
    </div>
  </div>
</div>

<div class="container py-4">
  <a href="{{ url_for('escanear_publico_pastas') }}" class="small"><i class="fas fa-arrow-left me-1"></i>Pastas</a>
  <h4 class="mt-1"><i class="fas fa-camera me-2"></i>Nova digitalização</h4>
  <p class="text-muted small">Tire uma foto por página — ajuste os 4 cantos pra recortar e endireitar, depois gere o PDF.</p>

  <div class="card mb-4">
    <div class="card-body">
      <input type="file" id="esc-input-foto" accept="image/*" capture="environment" style="display:none;">
      <button type="button" class="btn btn-laranja" onclick="document.getElementById('esc-input-foto').click();">
        <i class="fas fa-camera me-1"></i>Tirar foto / escolher imagem
      </button>
      <span class="text-muted small ms-2">Página <b id="esc-contador">0</b> adicionada(s)</span>
    </div>
  </div>

  <div id="esc-paginas" class="row g-3 mb-4"></div>

  <div class="card" id="esc-card-salvar" style="display:none;">
    <div class="card-body">
      <div class="row g-3">
        <div class="col-md-6">
          <label class="form-label small text-muted">Pasta</label>
          <input type="text" id="esc-pasta" class="form-control" list="esc-pastas-lista" value="{{ pasta_sugerida or '' }}" placeholder="Ex: Notas fiscais">
          <datalist id="esc-pastas-lista">
            {% for p in pastas_existentes %}<option value="{{ p }}">{% endfor %}
          </datalist>
        </div>
        <div class="col-md-6">
          <label class="form-label small text-muted">Nome do documento</label>
          <input type="text" id="esc-nome" class="form-control" placeholder="Ex: Recibo 21-10">
        </div>
      </div>
      <button type="button" class="btn btn-laranja mt-3" id="esc-btn-gerar" onclick="escGerarPdf();">
        <i class="fas fa-file-pdf me-1"></i>Gerar PDF
      </button>
      <span id="esc-status" class="ms-2 small text-muted"></span>
    </div>
  </div>

  <div class="card" id="esc-card-sucesso" style="display:none;">
    <div class="card-body text-center py-4">
      <i class="fas fa-circle-check fa-2x mb-2" style="color:#16a34a;"></i>
      <div class="mb-3">PDF gerado!</div>
      <button type="button" class="btn btn-laranja me-2" onclick="escCompartilharGerado();">
        <i class="fas fa-share-nodes me-1"></i>Compartilhar
      </button>
      <a href="#" id="esc-link-pasta" class="btn btn-outline-light">Ver na pasta</a>
    </div>
  </div>
</div>

<!-- Overlay de recorte (ajuste dos 4 cantos) -->
<div id="esc-overlay" style="display:none; position:fixed; inset:0; background:#000; z-index:2000;">
  <div style="position:relative; width:100%; height:100%; display:flex; flex-direction:column;">
    <div class="d-flex justify-content-between align-items-center p-2" style="background:#111;">
      <span class="text-white small">Ajuste os 4 cantos sobre o documento</span>
      <div>
        <button type="button" class="btn btn-sm btn-outline-light me-2" onclick="escCancelarRecorte();">Cancelar</button>
        <button type="button" class="btn btn-sm btn-laranja" onclick="escConfirmarRecorte();">Confirmar</button>
      </div>
    </div>
    <div id="esc-canvas-wrap" style="position:relative; flex:1; overflow:hidden; touch-action:none;">
      <canvas id="esc-canvas-origem"></canvas>
      <svg id="esc-svg-cantos" style="position:absolute; top:0; left:0;"></svg>
    </div>
  </div>
</div>

<script>window.ESC_POST_URL = "{{ url_for('escanear_publico_salvar') }}";</script>
<script src="{{ url_for('static', filename='js/escanear.js') }}"></script>
</body>
</html>
