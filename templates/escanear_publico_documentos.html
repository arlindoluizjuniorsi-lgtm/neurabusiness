<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{ pasta }} — Escanear Documentos</title>
<link rel="icon" type="image/png" sizes="32x32" href="{{ url_for('static', filename='img/favicon-32.png') }}">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
  body{background:#0f172a;color:#e2e8f0;font-family:system-ui,sans-serif;min-height:100vh;}
  .topo{background:#111827;border-bottom:1px solid #2a3647;padding:14px 0;}
  .logo{color:#f97316;font-weight:800;font-size:1.25rem;}
  .card{background:#1a2332;border:1px solid #2a3647;border-radius:12px;}
  .table{color:#e2e8f0;}
  .table>:not(caption)>*>*{background-color:transparent;border-bottom-color:#2a3647;}
  .btn-laranja{background:#f97316;border-color:#f97316;color:#fff;font-weight:600;}
  .btn-laranja:hover{background:#dd6614;border-color:#dd6614;color:#fff;}
  a{color:#f97316;}
  .text-muted{color:#94a3b8!important;}
</style>
</head>
<body>
<div class="topo">
  <div class="container d-flex justify-content-between align-items-center flex-wrap gap-2">
    <div class="logo"><i class="fas fa-camera me-2"></i>Escanear Documentos</div>
    <div class="small text-muted">
      {{ conta.nome or conta.email }} &middot;
      <a href="{{ url_for('escanear_publico_sair') }}">Sair</a>
    </div>
  </div>
</div>

<div class="container py-4">
  <div class="d-flex justify-content-between align-items-center flex-wrap gap-2 mb-3">
    <div>
      <a href="{{ url_for('escanear_publico_pastas') }}" class="small"><i class="fas fa-arrow-left me-1"></i>Pastas</a>
      <h4 class="mb-0 mt-1"><i class="fas fa-folder-open me-2"></i>{{ pasta }}</h4>
    </div>
    <a href="{{ url_for('escanear_publico_novo', pasta=pasta) }}" class="btn btn-laranja"><i class="fas fa-plus me-1"></i>Nova digitalização</a>
  </div>

  <div class="card">
    <div class="table-responsive">
      <table class="table table-hover align-middle mb-0">
        <thead>
          <tr>
            <th>Documento</th>
            <th>Páginas</th>
            <th>Enviado em</th>
            <th class="text-end">Ações</th>
          </tr>
        </thead>
        <tbody>
          {% for d in documentos %}
          <tr>
            <td><i class="fas fa-file-pdf text-danger me-1"></i><b>{{ d.nome_arquivo }}</b></td>
            <td>{{ d.num_paginas }}</td>
            <td class="text-muted" style="font-size:0.82rem;">{{ d.criado_em.strftime('%d/%m/%Y %H:%M') if d.criado_em else '' }}</td>
            <td class="text-end">
              <a href="{{ url_for('escanear_publico_baixar', id=d.id, inline=1) }}" target="_blank" class="btn btn-sm btn-outline-light" title="Ver"><i class="fas fa-eye"></i></a>
              <a href="{{ url_for('escanear_publico_baixar', id=d.id) }}" class="btn btn-sm btn-outline-light" title="Baixar"><i class="fas fa-download"></i></a>
              <form method="POST" action="{{ url_for('escanear_publico_excluir', id=d.id) }}" class="d-inline" onsubmit="return confirm('Excluir \'{{ d.nome_arquivo }}\'?');">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                <button type="submit" class="btn btn-sm btn-outline-danger"><i class="fas fa-trash"></i></button>
              </form>
            </td>
          </tr>
          {% endfor %}
        </tbody>
      </table>
    </div>
  </div>
</div>
</body>
</html>
