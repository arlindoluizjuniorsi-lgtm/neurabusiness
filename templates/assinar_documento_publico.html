<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Assinar — {{ doc.nome_arquivo }}</title>
<link rel="icon" type="image/png" sizes="32x32" href="{{ url_for('static', filename='img/favicon-32.png') }}">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
  body{background:#0f172a;color:#e2e8f0;font-family:system-ui,sans-serif;min-height:100vh;}
  .topo{background:#111827;border-bottom:1px solid #2a3647;padding:14px 0;}
  .logo{color:#f97316;font-weight:800;font-size:1.25rem;}
  .card{background:#1a2332;border:1px solid #2a3647;border-radius:12px;}
  .card-header,.card-footer{background:rgba(255,255,255,.03);border-color:#2a3647;color:#e2e8f0;}
  .form-control,.form-select{background:#0f172a;border-color:#2a3647;color:#e2e8f0;}
  .form-control:focus,.form-select:focus{background:#0f172a;border-color:#f97316;color:#e2e8f0;box-shadow:0 0 0 .2rem rgba(249,115,22,.2);}
  .btn-accent{background:#f97316;border-color:#f97316;color:#fff;font-weight:600;}
  .btn-accent:hover{background:#dd6614;border-color:#dd6614;color:#fff;}
  a{color:#f97316;}
  .text-muted{color:#94a3b8!important;}
</style>
</head>
<body>
<div class="topo">
  <div class="container d-flex justify-content-between align-items-center flex-wrap gap-2">
    <div class="logo"><i class="fas fa-camera me-2"></i>Escanear Documentos</div>
    <div class="small text-muted">
      {{ conta.nome or conta.email }} &middot;
      <a href="{{ url_for('escanear_publico_sair') }}">Sair</a>
    </div>
  </div>
</div>

<div class="container py-4">
  {% with messages = get_flashed_messages(with_categories=true) %}
    {% if messages %}
      {% for category, message in messages %}
      <div class="alert alert-{{ category }} alert-dismissible fade show">{{ message }}
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
      </div>
      {% endfor %}
    {% endif %}
  {% endwith %}

  {% include "_assinar_documento_conteudo.html" %}
</div>
</body>
</html>
