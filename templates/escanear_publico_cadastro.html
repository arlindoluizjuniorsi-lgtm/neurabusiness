<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Criar conta — Escanear Documentos</title>
<link rel="icon" type="image/png" sizes="32x32" href="{{ url_for('static', filename='img/favicon-32.png') }}">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
  body{background:#0f172a;color:#e2e8f0;font-family:system-ui,sans-serif;min-height:100vh;display:flex;align-items:center;}
  .cartao{background:#1a2332;border:1px solid #2a3647;border-radius:16px;max-width:420px;margin:0 auto;padding:32px 28px;}
  .logo{color:#f97316;font-weight:800;font-size:1.5rem;}
  .form-control{background:#0f172a;border-color:#2a3647;color:#e2e8f0;}
  .form-control:focus{background:#0f172a;border-color:#f97316;color:#e2e8f0;box-shadow:0 0 0 .2rem rgba(249,115,22,.2);}
  .btn-laranja{background:#f97316;border-color:#f97316;color:#fff;font-weight:600;}
  .btn-laranja:hover{background:#dd6614;border-color:#dd6614;color:#fff;}
  a{color:#f97316;}
</style>
</head>
<body>
<div class="container py-4">
  <div class="cartao">
    <div class="text-center mb-4">
      <div class="logo"><i class="fas fa-camera me-2"></i>Escanear Documentos</div>
      <small class="text-secondary">Crie sua conta — seus documentos ficam só com você.</small>
    </div>

    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        {% for category, message in messages %}
        <div class="alert alert-{{ category }} alert-dismissible fade show">{{ message }}
          <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>
        {% endfor %}
      {% endif %}
    {% endwith %}

    <form method="POST">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <div class="mb-3">
        <label class="form-label small text-secondary">Nome</label>
        <input type="text" name="nome" class="form-control" autofocus>
      </div>
      <div class="mb-3">
        <label class="form-label small text-secondary">E-mail</label>
        <input type="email" name="email" class="form-control" required>
      </div>
      <div class="mb-3">
        <label class="form-label small text-secondary">Senha (mínimo 6 caracteres)</label>
        <input type="password" name="senha" class="form-control" minlength="6" required>
      </div>
      <button type="submit" class="btn btn-laranja w-100 py-2">Criar conta</button>
    </form>

    <div class="text-center mt-3 small">
      Já tem conta? <a href="{{ url_for('escanear_publico_entrar') }}">Entrar</a>
    </div>
  </div>
</div>
</body>
</html>
