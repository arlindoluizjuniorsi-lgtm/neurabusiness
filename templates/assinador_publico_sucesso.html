<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Neura Assinador — Documento assinado</title>
<link rel="icon" type="image/png" sizes="32x32" href="{{ url_for('static', filename='img/favicon-32.png') }}">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
  body{background:#0f172a;color:#e2e8f0;font-family:system-ui,sans-serif;min-height:100vh;display:flex;align-items:center;}
  .cartao{background:#1a2332;border:1px solid #2a3647;border-radius:16px;max-width:480px;margin:0 auto;padding:32px 28px;text-align:center;}
  .btn-laranja{background:#f97316;border-color:#f97316;color:#fff;font-weight:600;}
  .btn-laranja:hover{background:#dd6614;border-color:#dd6614;color:#fff;}
</style>
</head>
<body>
<div class="container py-4">
  <div class="cartao">
    <i class="fas fa-circle-check fa-3x mb-3" style="color:#10B981;"></i>
    <h5 class="mb-1">Documento assinado!</h5>
    <p class="text-secondary small mb-4">{{ doc.nome_arquivo }}</p>

    <a href="{{ url_for('assinador_publico_baixar', token=doc.token_publico, tipo='assinado') }}" class="btn btn-laranja w-100 py-2 mb-2">
      <i class="fas fa-download me-1"></i>Baixar documento assinado
    </a>
    <a href="{{ url_for('assinador_publico') }}" class="btn btn-outline-secondary w-100">
      <i class="fas fa-plus me-1"></i>Assinar outro documento
    </a>

    <div class="mt-4" style="font-size:.7rem;color:#64748b;">
      <i class="fas fa-shield-alt me-1"></i>
      {% if doc.hash_sha256 %}Hash SHA-256: <code style="word-break:break-all;color:#94a3b8;">{{ doc.hash_sha256 }}</code><br>{% endif %}
      Esse link fica disponível por 24h.
    </div>
  </div>
</div>
</body>
</html>
